<!-- ── Main Header (always sticky) ───────────────────────────── -->
<header class="header" [class.scrolled]="isScrolled">
  <div class="container">
    <nav class="nav">
      <!-- Logo -->
      <a routerLink="/" class="logo">
        <span class="logo-icon">
          <span class="material-symbols-outlined">hub</span>
        </span>
        <span class="logo-text">BriskPeople</span>
      </a>
      <!-- Desktop Navigation -->
      <div class="nav-links" [class.mobile-open]="isMenuOpen">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
          (click)="closeMenu()">Home</a>
        <a routerLink="/features" routerLinkActive="active" (click)="closeMenu()">Features</a>
        <a routerLink="/pricing" routerLinkActive="active" (click)="closeMenu()">Pricing</a>
        <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About</a>
        <a routerLink="/blog" routerLinkActive="active" (click)="closeMenu()">Blog</a>
      </div>
      <!-- CTA Button -->
      <div class="nav-actions">
        <a href="https://login.briskpeople.com" class="btn btn-ghost login-btn">Login</a>
        <a routerLink="/sign-up" class="btn btn-primary">Sign Up</a>
        <!-- Mobile Menu Toggle -->
        <button class="mobile-menu-toggle" (click)="toggleMenu()" aria-label="Toggle menu">
          <span class="material-symbols-outlined">{{ isMenuOpen ? 'close' : 'menu' }}</span>
        </button>
      </div>
    </nav>
  </div>
</header>

<!-- Spacer so page content doesn't hide under fixed header+topbar -->
<!-- Height = 36px (top bar) + 72px (header) = 108px; collapses to 72px when scrolled -->
<div class="header-spacer" [class.scrolled]="isScrolled"></div>
